<script>
/* ===== 统一正文加载器 ===== */
(function () {
  'use strict';

  function $(s, c) { return (c || document).querySelector(s); }
  function qa(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 从 CATALOG 展平的条目里取 "数字徽标"
  function numOf(t) {
    var m = String(t).match(/^([0-9A-Za-z\u4e00-\u9fa5\u00B7①-]+)/);
    var code = m ? m[1].replace(/\u00B7+$/, '') : t.slice(0, 1);
    if (code.length > 4) code = code.slice(0, 2);
    return code;
  }

  // 生成左侧章节树
  function buildSidebar(activeFile) {
    var nav = $('#side-nav');
    if (!nav) return;
    var html = '';
    window.CATALOG.forEach(function (g) {
      var open = g.items.some(function (it) { return it.f === activeFile; });
      html += '<div class="side-group' + (open ? ' is-open' : '') + '">';
      html += '<div class="side-label">' + esc(g.title) + '</div>';
      g.items.forEach(function (it) {
        var on = it.f === activeFile;
        html += '<a class="side-link' + (on ? ' active' : '') + '" href="doc.html?doc=' +
          encodeURIComponent(it.f) + '" title="' + esc(window.fullTitle(it)) + '">' +
          '<span class="num">' + esc(it.n || numOf(it.t)) + '</span>' + esc(it.t) + '</a>';
      });
      html += '</div>';
    });
    nav.innerHTML = html;
  }

  // TOC：可折叠大纲（H2 一级，H3/H4 为子级），每个父标题一个折叠箭头，当前标题高亮
  function tocLev(tag) { return tag === 'H4' ? 2 : tag === 'H3' ? 1 : 0; }

  // 过滤标题里的图形 emoji / 变体选择符 / 零宽连接符（仅目录展示用，不动正文）
  function stripEmoji(s) {
    return String(s)
      .replace(/[\u{1F000}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
      .replace(/\s+/g, ' ').trim();
  }

  function buildToc() {
    var box = $('#toc-links');
    if (!box) return;
    var heads = qa('#doc-body h2, #doc-body h3, #doc-body h4');
    if (!heads.length) { box.innerHTML = '<span class="toc-empty">（本章无小节）</span>'; return; }
    var entries = heads.map(function (h) {
      if (!h.id) h.id = 'sec-' + Math.random().toString(36).slice(2, 8);
      return { id: h.id, text: stripEmoji(h.textContent), level: tocLev(h.tagName) };
    });
    // 组装树：子条目挂在最近的上一层条目下
    var nodes = entries.map(function (d) { return { data: d, children: [] }; });
    var stack = [];
    nodes.forEach(function (n) {
      while (stack.length && stack[stack.length - 1].data.level >= n.data.level) stack.pop();
      if (stack.length) stack[stack.length - 1].children.push(n);
      stack.push(n);
    });
    function render(n) {
      var has = n.children && n.children.length;
      var car = has ? '<button class="toc-car" data-role="car">▸</button>' : '<span class="toc-car ghost"></span>';
      var sub = has ? '<div class="toc-sub">' + n.children.map(render).join('') + '</div>' : '';
      return '<div class="toc-node">' + car +
        '<a class="toc-link toc-lv' + n.data.level + '" href="#' + n.data.id + '">' + esc(n.data.text) + '</a>' +
        sub + '</div>';
    }
    var html = '<div class="toc-tree">' +
      nodes.filter(function (n) { return n.data.level === 0; }).map(render).join('') +
      '</div>';
    box.innerHTML = html;
    tocCars();
    tocBind();
    tocScroll();
  }

  function tocCars() {
    qa('.toc-tree .toc-car:not(.ghost)').forEach(function (c) {
      c.classList.toggle('on', !c.closest('.toc-node').classList.contains('collapsed'));
    });
  }

  function tocBind() {
    var tree = $('.toc-tree');
    if (!tree) return;
    tree.addEventListener('click', function (e) {
      var car = e.target.closest('.toc-car');
      if (!car || car.classList.contains('ghost')) return;
      e.preventDefault();
      var nd = car.closest('.toc-node');
      nd.classList.toggle('collapsed');
      tocCars(); tocScroll();
    });
  }

  // 滚动高亮当前最近标题（只统计可见 / 未折叠的链接，绑定一次）
  function tocScroll() {
    if (!window.__tocScroll) {
      window.__tocScroll = function () {
        var links = [];
        qa('.toc-tree .toc-link').forEach(function (a) {
          var nd = a.closest('.toc-node');
          var p = nd.parentElement;
          while (p && !p.classList.contains('toc-tree')) {
            if (p.classList.contains('toc-node') && p.classList.contains('collapsed')) return;
            p = p.parentElement;
          }
          var el = document.getElementById(a.getAttribute('href').slice(1));
          if (el) links.push({ a: a, el: el });
        });
        if (!links.length) return;
        var mark = links[0];
        links.forEach(function (x) { if (x.el.getBoundingClientRect().top <= 90) mark = x; });
        links.forEach(function (x) { x.a.classList.toggle('active', x.a === mark.a); });
      };
      window.addEventListener('scroll', window.__tocScroll, { passive: true });
    }
    window.__tocScroll();
  }

  // 处理正文里相对路径的 .md 链接 → 转成 doc.html?doc=
  function rebaseLinks(basePath) {
    var dir = String(basePath).split('/');
    dir.pop(); // 去掉文件名，保留目录
    qa('#doc-body a').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href) return;
      if (/^[a-z]+:/i.test(href) || href.charAt(0) === '#' || href.charAt(0) === '/') return;
      // 相对 .md → 规整为相对 content/ 的路径
      var parts = href.split(/[\\/]/);
      var stack = dir.slice();
      parts.forEach(function (seg) {
        if (seg === '.' || seg === '') return;
        if (seg === '..') stack.pop();
        else stack.push(seg);
      });
      var rel = stack.join('/');
      a.setAttribute('href', 'doc.html?doc=' + encodeURIComponent(rel));
    });
  }

  function setPager(cur, list) {
    var i = 0;
    for (var k = 0; k < list.length; k++) {
      if (list[k].f === cur) { i = k; break; }
    }
    var box = $('#pager');
    if (!box || !list.length) return;
    function fullOf(it) { return window.fullTitle ? window.fullTitle(it) : it.t; }
    var prev = i > 0 ? '<a href="doc.html?doc=' + encodeURIComponent(list[i - 1].f) + '">← ' + esc(fullOf(list[i - 1])) + '</a>' : '<span>← 第一章</span>';
    var next = i < list.length - 1 ? '<a href="doc.html?doc=' + encodeURIComponent(list[i + 1].f) + '">' + esc(fullOf(list[i + 1])) + ' →</a>' : '<span>最后一章 →</span>';
    var home = '<a href="index.html">首页</a>';
    box.innerHTML = home + prev + next;
  }

  // 全文线性顺序（导读→共享→工具→B1→B2→B3→大纲），用于上一章/下一章
  function linear() {
    var arr = [];
    window.CATALOG.forEach(function (g) {
      arr = arr.concat(g.items);
    });
    return arr;
  }

  function load() {
    var qs = new URLSearchParams(location.search);
    var file = qs.get('doc') || '00-导读/README.md';
    buildSidebar(file);
    var flat = window.FLAT || [];
    var item = null;
    for (var i = 0; i < flat.length; i++) if (flat[i].f === file) { item = flat[i]; break; }

    var sealtxt = '程';
    if (item) {
      var sm = String(item.n || '').match(/^(B\d+)/);
      sealtxt = sm ? sm[1] : (item.n && item.n.length > 2 ? item.n.slice(0, 1) : (item.n || ''));
    }
    $('#crumb-seal').textContent = sealtxt;
    $('#crumb-title').textContent = item ? item.t : '未找到章节';
    document.title = (item ? window.fullTitle(item) + ' · ' : '') + 'Vibe Coding 工程化';
    var badgeName = document.getElementById('badge-name');
    if (badgeName) badgeName.textContent = item ? (item.n || item.t) : '章节';

    fetch('content/' + file)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (md) {
        $('#doc-body').innerHTML = window.renderMarkdown(md);
        rebaseLinks(file);
        buildToc();
        setPager(file, linear());
        if (item) setActiveNav(item.group);
        if (/^00-导读\//.test(file)) {
          $('#doc-body').insertAdjacentHTML('beforebegin',
            '<p class="tn-more"><a href="about.html#projects">查看配套项目 →</a></p>');
        }
      })
      .catch(function () {
        $('#doc-body').innerHTML =
          '<div class="doc-missing"><h2>未能载入该章节</h2><p>文件不存在或路径有误：<code>' +
          esc(file) + '</code></p><p><a href="index.html">返回首页</a></p></div>';
      });
  }

  function setActiveNav(groupTitle) {
    var links = qa('.nav-links > a, .nav-links > .nav-dd');
    links.forEach(function (a) { a.classList.remove('active'); });
    var map = { '00 · 导读': 1, '10 · 共享单元': 3, '20 · 工具库': 3, '大纲': 2, '30 · B1 通用需求轨道': 2, '40 · B2 Bug 修复轨道': 2, '50 · B3 重构轨道': 2 };
    var idx = map[groupTitle];
    if (idx != null && links[idx]) links[idx].classList.add('active');
  }

  // 回车跳转到搜索命中的第一条
  function bindSearch(list) {
    var inp = $('#search-input');
    if (!inp) return;
    inp.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var q = inp.value.trim().toLowerCase();
      if (!q) return;
      var hit = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].t.toLowerCase().indexOf(q) >= 0 || list[i].f.toLowerCase().indexOf(q) >= 0) { hit = list[i]; break; }
      }
      if (hit) location.href = 'doc.html?doc=' + encodeURIComponent(hit.f);
    });
  }

  load();
  bindSearch(linear());
})();
</script>
